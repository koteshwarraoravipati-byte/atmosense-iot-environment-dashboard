name: CI
on: {push: {branches: [main, harden-production-readiness]}, pull_request: {branches: [main]}}
permissions: {contents: read}
jobs: {dashboard: {runs-on: ubuntu-latest, defaults: {run: {working-directory: dashboard}}, steps: [{name: Check out repository, uses: actions/checkout@v4}, {name: Use Node.js, uses: actions/setup-node@v4, with: {node-version: 20, cache: npm, cache-dependency-path: dashboard/package-lock.json}}, {name: Install dependencies, run: npm ci}, {name: Syntax check, run: npm run check}, {name: Run tests, run: npm test}]}}
